[package]
name = "sentinel-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "RpcProvider/RpcPool traits, capability discovery, budgets, retry, breaker, freshness, WS manager, broadcast, fixtures, fault injection. Phase 3."

[dependencies]
sentinel-core = { workspace = true }
sentinel-config = { workspace = true }
sentinel-db = { workspace = true }
sentinel-telemetry = { workspace = true }
solana-rpc-client = { workspace = true }
solana-pubsub-client = { workspace = true }
solana-transaction-status = { workspace = true }
solana-rpc-client-api = "4.2.2"
solana-commitment-config = "3.1.1"
solana-hash = "4.5.0"
solana-signature = "3.4.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
async-trait = "0.1.92"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rand = "0.8"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
opentelemetry = { workspace = true }
sqlx = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Pulled transitively by solana-rpc-client already (see Cargo.lock); pinned
# here explicitly only because the SR-7 capability probe builds and signs a
# real transaction itself, rather than shelling out to the `solana` CLI.
solana-keypair = "3.1.2"
solana-pubkey = "4.2.1"
solana-message = "4.4.1"
solana-transaction = "4.1.6"
solana-system-interface = "3.2.0"
solana-signer = "3.0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
sentinel-db = { workspace = true, features = [] }
