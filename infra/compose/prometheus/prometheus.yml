# Local-only Prometheus config (ADR-0014). Scrapes the OTel Collector's
# Prometheus exporter and itself. No remote_write, no external target —
# the zero-cost local path (ADR-0013) means this never reaches past
# loopback/the Compose network.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
